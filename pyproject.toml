[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Ahmed", email = "atarekmokhtar90@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "onnxruntime>=1.29.0",
    "tokenizers>=0.23.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
app = "app:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.15.4",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-html-plus>=1.2.0",
]
